<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資産ダッシュボード</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>資産ダッシュボード</h1>
    <div class="total-assets">
      <span class="label">総資産額</span>
      <span id="totalAssets" class="amount">取得中...</span>
    </div>
    <div class="holdings-summary">
      <div class="summary-item">
        <span class="label">ポートフォリオ評価額</span>
        <span id="totalValuation" class="amount-small">---</span>
      </div>
      <div class="summary-item">
        <span class="label">総合評価損益</span>
        <span id="totalUnrealizedGain" class="amount-small">---</span>
      </div>
    </div>
  </header>
  
  <main>
    <section class="chart-container">
      <h2>資産内訳（カテゴリ別）</h2>
      <div class="chart-wrapper">
        <canvas id="pieChart"></canvas>
      </div>
      <div id="categoryList" class="category-list"></div>
    </section>
    
    <section class="chart-container">
      <h2>資産推移（履歴）</h2>
      <div class="chart-wrapper">
        <canvas id="lineChart"></canvas>
      </div>
    </section>
    
    <section class="chart-container full-width">
      <h2>保有銘柄詳細</h2>
      <div id="holdingsContent">
        <div class="holdings-tabs">
          <button class="tab-btn active" data-cat="株式(現物)">株式</button>
          <button class="tab-btn" data-cat="投資信託">投資信託</button>
          <button class="tab-btn" data-cat="年金">年金</button>
        </div>
        <div id="holdingsTableContainer"></div>
      </div>
    </section>
  </main>
  
  <script src="app.js"></script>
</body>
</html>
